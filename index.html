* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    background: #0d0820;
}

#stars {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    0% { opacity: .12; }
    100% { opacity: .95; }
}

.planet {
    position: absolute;
    border-radius: 50%;
    opacity: .13;
}

#layout {
    display: flex;
    min-height: 100vh;
    position: relative;
    z-index: 1;
}

#sidebar {
    width: 195px;
    min-width: 195px;
    background: rgba(10, 5, 35, .88);
    border-right: 1px solid rgba(255, 255, 255, .1);
    padding: 14px 8px 14px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    backdrop-filter: blur(14px);
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
}

#sidebar-title {
    color: rgba(200, 180, 255, .5);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    padding: 2px 0 8px;
    font-family: 'Segoe UI', sans-serif;
}

.cat-btn {
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 13px;
    padding: 9px 10px;
    cursor: pointer;
    font-size: 12px;
    color: rgba(255, 255, 255, .8);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 9px;
    transition: all .18s;
    font-family: 'Segoe UI', sans-serif;
    text-align: left;
    width: 100%;
}

.cat-btn:hover {
    background: rgba(150, 100, 255, .28);
    border-color: rgba(180, 140, 255, .45);
    color: #fff;
    transform: translateX(4px);
}

.cat-btn.active {
    background: rgba(140, 100, 255, .42);
    border-color: rgba(200, 160, 255, .55);
    color: #fff;
}

.cat-icon {
    font-size: 20px;
    flex-shrink: 0;
}

.cat-label {
    font-size: 12px;
    line-height: 1.2;
}

#main {
    flex: 1;
    padding: 16px 18px 90px;
    display: flex;
    flex-direction: column;
}

#header {
    text-align: center;
    padding: 4px 0 12px;
}

#title-text {
    color: #fff;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 3px;
    text-shadow: 0 0 30px rgba(200, 160, 255, .9);
    font-family: 'Segoe UI', sans-serif;
}

#subtitle {
    color: rgba(200, 180, 255, .6);
    font-size: 11px;
    letter-spacing: 4px;
    margin-top: 3px;
    font-family: 'Segoe UI', sans-serif;
}

#gear-wrap {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 200;
}

#gear-btn {
    background: rgba(255, 255, 255, .12);
    border: 1.5px solid rgba(255, 255, 255, .25);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    font-size: 19px;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .2s;
    backdrop-filter: blur(8px);
}

#gear-btn:hover {
    background: rgba(255, 255, 255, .25);
    transform: rotate(40deg);
}

#lang-panel {
    display: none;
    position: absolute;
    top: 48px;
    right: 0;
    background: rgba(12, 6, 42, .97);
    border: 1px solid rgba(180, 140, 255, .3);
    border-radius: 18px;
    padding: 8px;
    z-index: 300;
    min-width: 152px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, .6);
}

#lang-panel.open {
    display: block;
}

#lang-panel button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 9px 12px;
    border: none;
    background: none;
    cursor: pointer;
    border-radius: 10px;
    font-size: 13px;
    color: rgba(255, 255, 255, .8);
    transition: background .15s;
    font-family: 'Segoe UI', sans-serif;
}

#lang-panel button:hover {
    background: rgba(255, 255, 255, .1);
    color: #fff;
}

#lang-panel button.active {
    background: rgba(150, 100, 255, .35);
    color: #d4b8ff;
    font-weight: 700;
}

#cat-title {
    color: rgba(255, 220, 120, .9);
    font-size: 12px;
    text-align: center;
    margin-bottom: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-family: 'Segoe UI', sans-serif;
}

#grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 10px;
}

/* --- SECCIÓN MODIFICADA PARA ACLARAR EL FONDO --- */
.item-card {
    /* Aumentamos la opacidad del blanco para que los emojis oscuros resalten */
    background: rgba(255, 255, 255, 0.18); 
    border: 1.5px solid rgba(255, 255, 255, 0.25);
    border-radius: 18px;
    padding: 13px 5px 9px;
    text-align: center;
    cursor: pointer;
    transition: all .18s;
    /* Un desenfoque más fuerte ayuda a separar la tarjeta del fondo de estrellas */
    backdrop-filter: blur(12px) saturate(140%);
    font-family: 'Segoe UI', sans-serif;
}

.item-card:hover {
    background: rgba(255, 255, 255, 0.28);
    border-color: rgba(255, 210, 100, .6);
    transform: translateY(-5px) scale(1.07);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
}

.item-card:active {
    transform: scale(.96);
}

.item-card .emoji {
    font-size: 32px;
    display: block;
    margin-bottom: 4px;
    line-height: 1;
    /* Sombra ligera para los emojis */
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.item-card .numtxt {
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    display: block;
    margin-bottom: 4px;
    line-height: 1.2;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
}
/* ----------------------------------------------- */

.item-card .label {
    font-size: 10.5px;
    color: rgba(255, 255, 255, .92);
    font-weight: 600;
    letter-spacing: .2px;
    line-height: 1.3;
}

#bubble {
    display: none;
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 220, 80, .97);
    border-radius: 32px;
    padding: 12px 28px;
    font-size: 19px;
    font-weight: 800;
    color: #2d1a00;
    box-shadow: 0 4px 28px rgba(255, 200, 0, .35);
    z-index: 500;
    white-space: nowrap;
    max-width: 88%;
    text-align: center;
    animation: popIn .2s ease;
    font-family: 'Segoe UI', sans-serif;
}

@keyframes popIn {
    0% { transform: translateX(-50%) scale(.7); opacity: 0; }
    100% { transform: translateX(-50%) scale(1); opacity: 1; }
}
</style>

const sbTitles={es:"Categorías",en:"Categories",pt:"Categorias",ko:"카테고리",it:"Categorie",fr:"Catégories"};
let lang='es',currentCat='frutas';

function makeStars(){
  const c=document.getElementById('stars');
  for(let i=0;i<80;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2.8+.7;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${(Math.random()*2.5+1.2).toFixed(1)}s;animation-delay:${(Math.random()*3).toFixed(1)}s`;
    c.appendChild(s);
  }
  const cols=['#7b4fff','#ff6bbd','#4fc3f7','#ffca28','#69f0ae'];
  for(let i=0;i<6;i++){
    const p=document.createElement('div');p.className='planet';
    const sz=Math.random()*110+40;
    p.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*90}%;left:${Math.random()*90}%;background:${cols[i%5]};filter:blur(${sz*.48}px)`;
    c.appendChild(p);
  }
}
makeStars();

function renderSidebar(){
  const list=document.getElementById('cat-list');
  list.innerHTML='';
  document.getElementById('sidebar-title').textContent=sbTitles[lang];
  Object.keys(DATA).forEach(key=>{
    const d=DATA[key];
    const b=document.createElement('button');
    b.className='cat-btn'+(key===currentCat?' active':'');
    b.id='sb-'+key;
    b.innerHTML=`<span class="cat-icon">${d.icon}</span><span class="cat-label">${d.names[lang]}</span>`;
    b.onclick=()=>renderGrid(key);
    list.appendChild(b);
  });
}

function renderGrid(cat){
  currentCat=cat;
  document.body.style.background=DATA[cat].bg||'#0d0820';
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  const ab=document.getElementById('sb-'+cat);if(ab)ab.classList.add('active');
  const items=DATA[cat].items;
  const g=document.getElementById('grid');g.innerHTML='';
  items.forEach(item=>{
    const d=document.createElement('div');d.className='item-card';
    let top,word;
    if(item.n!==undefined){
      top=`<span class="numtxt">${item.n}</span>`;
      word=item[lang];
    } else {
      top=`<span class="emoji">${item.e}</span>`;
      word=item[lang];
    }
    d.innerHTML=`${top}<span class="label">${word}</span>`;
    d.onclick=()=>speak(word, item.e||String(item.n));
    g.appendChild(d);
  });
  document.getElementById('cat-title').textContent=DATA[cat].names[lang];
}

function setLang(l){
  lang=l;
  document.querySelectorAll('#lang-panel button').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+l).classList.add('active');
  document.getElementById('lang-panel').classList.remove('open');
  renderSidebar();renderGrid(currentCat);
}

document.getElementById('gear-btn').onclick=function(e){
  e.stopPropagation();
  document.getElementById('lang-panel').classList.toggle('open');
};
document.addEventListener('click',()=>document.getElementById('lang-panel').classList.remove('open'));
document.getElementById('lang-panel').addEventListener('click',e=>e.stopPropagation());

let bubTimer=null;
function speak(text,emoji){
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const lc={es:'es-ES',en:'en-US',pt:'pt-BR',ko:'ko-KR',it:'it-IT',fr:'fr-FR'};
    u.lang=lc[lang];u.rate=0.88;speechSynthesis.speak(u);
  }
  const b=document.getElementById('bubble');
  b.textContent=emoji+'  '+text;
  b.style.display='block';
  clearTimeout(bubTimer);
  bubTimer=setTimeout(()=>b.style.display='none',2600);
}

renderSidebar();renderGrid('frutas');
</script>
